name: Build and publish Tailnet Gateway

on:
  push:
    branches: [main]
    tags: ["v*", "!v*-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tailnet-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build image and entrypoint
        run: |
          nix build .#entrypoint --out-link /tmp/tailnet-gateway-entrypoint
          nix build .#image --out-link /tmp/tailnet-gateway-image
          bash -n /tmp/tailnet-gateway-entrypoint/bin/entrypoint.sh

      - name: Load and inspect image
        run: |
          docker load --input /tmp/tailnet-gateway-image
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.title" }}' tailnet-gateway:latest)" = "Tailnet Gateway"
          docker image inspect --format '{{ json .Config.ExposedPorts }}' tailnet-gateway:latest

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/rogernavelsaker/tailnet-gateway
            ghcr.io/rogernavelsaker/ts-caddy-gateway
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tags
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag tailnet-gateway:latest "$tag"
            docker push "$tag"
          done <<< "$TAGS"
